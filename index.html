<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オノマトペクイズ</title>
    <style>
        /* =========================================
           STUDIO風デザインスタイルリング
        ========================================= */

        /* 全体のリセットと基本設定 */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
            text-align: center;
            background-color: #f0f2f5; /* 背景を少しグレーにしてコンテンツを際立たせる */
            color: #444;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        /* クイズ全体を囲むコンテナ（カード風デザイン） */
        .quiz-container {
            background-color: #fff;
            max-width: 800px;
            margin: 40px auto; /* 上下に余白、左右中央揃え */
            padding: 50px 30px;
            border-radius: 24px; /* STUDIOのような大きな角丸 */
            box-shadow: 0 12px 36px rgba(0,0,0,0.08); /* ふんわりしたリッチな影 */
            position: relative; /* 閉じるボタンの配置基準 */
        }

        /* 見出し */
        h1 {
            font-size: 1.6rem;
            margin-bottom: 40px;
            color: #333;
            letter-spacing: 0.05em;
        }
        
        /* 「クイズをおわる（×）」ボタン */
        #close-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: none;
            border: none;
            font-size: 1rem;
            color: #aaa;
            cursor: pointer;
            padding: 8px;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #close-btn:hover {
            color: #555;
        }
        
        /* 動画エリア */
        #video-container {
            max-width: 640px;
            margin: 0 auto 40px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 16px; /* 動画の角も丸く */
            overflow: hidden;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        #video-container iframe {
            width: 100% !important;
            height: 100% !important;
        }

        /* 選択肢ボタンのコンテナ */
        #choices-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2列で表示 */
            gap: 24px; /* 間隔を広げる */
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* 選択肢ボタンのスタイル（STUDIO風） */
        .choice-btn {
            background-color: #fff;
            border: none; /* 枠線をなくす */
            border-radius: 50px; /* 完全な角丸（楕円） */
            padding: 20px 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); /* 滑らかな動き */
            box-shadow: 0 6px 16px rgba(0,0,0,0.08); /* 柔らかい影 */
        }

        /* ホバー時のエフェクト（浮き上がる） */
        .choice-btn:hover:not(:disabled) {
            background-color: #fff;
            box-shadow: 0 12px 24px rgba(0,0,0,0.12); /* 影を濃く */
            transform: translateY(-4px); /* 上に移動 */
            color: #333;
        }

        /* ボタンが無効化された時（回答後） */
        .choice-btn:disabled {
            opacity: 0.7;
            cursor: default;
            box-shadow: none;
            transform: none;
            background-color: #f9f9f9;
        }

        /* 結果表示エリア */
        #result-area {
            margin-top: 50px;
            font-weight: bold;
            font-size: 1.6rem;
            min-height: 40px;
        }
        .correct { color: #e60033; }
        .incorrect { color: #333; }

        /* 「次の問題へ」ボタン */
        #next-btn {
            display: none; /* 最初は隠す */
            margin-top: 30px;
            padding: 18px 50px;
            background-color: #333; /* 黒背景で強調 */
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        #next-btn:hover {
            background-color: #555;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
            transform: translateY(-2px);
        }

        /* スマホ表示の調整 */
        @media (max-width: 600px) {
            .quiz-container {
                padding: 30px 20px;
                margin: 20px auto;
                border-radius: 16px;
            }
            #choices-container {
                grid-template-columns: 1fr; /* スマホでは1列 */
                gap: 16px;
            }
            h1 { font-size: 1.3rem; margin-bottom: 30px; }
            .choice-btn { padding: 18px 10px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="quiz-container">

        <button id="close-btn" onclick="window.close()">
            <span style="font-size: 1.4em;">×</span> クイズを おわる
        </button>

        <h1>この どうがの オノマトペは どれ？</h1>

        <div id="video-container"></div>

        <div id="choices-container">
            </div>

        <div id="result-area"></div>
        
        <button id="next-btn" onclick="location.reload();">つぎの もんだいへ</button>

    </div>
    <script src="https://player.vimeo.com/api/player.js"></script>

    <script>
        // ==========================================
        // 【設定エリア】ここを書き換えてください
        // ==========================================
        // クイズデータのリスト
        const quizData = [
            // --- 1個目 ---
            {
                vimeoId: 'https://vimeo.com/1148246748/5d94598b5e?fl=ml&fe=ec', // ※ご自身のVimeo URLに書き換えてください
                answer: 'ふにゃー',
                options: ['ふらふら', 'ふにゃー', 'ふわり', 'ふかふか']
            },
            // --- 2個目 ---
            {
                vimeoId: 'https://vimeo.com/1148246757/7fbc371057?fl=ml&fe=ec',
                answer: 'ふわり',
                options: ['ふかふか', 'ふわり', 'ふにゃー', 'ふっくら']
            },
            // --- 3個目 ---
            {
                vimeoId: 'https://vimeo.com/1148246767/e87a9274d7?fl=ml&fe=ec',
                answer: 'ふわふわ',
                options: ['ふわり', 'ふらふら', 'ふわふわ', 'ふにゃー']
            },
            // ... 他のデータもここに追加してください ...
             // --- 4個目 ---
            {
                vimeoId: 'https://vimeo.com/1148246781/8f7c5d0339?fl=ml&fe=ec', // ※サンプル用に同じIDを入れています
                answer: 'ふかふか',
                options: ['ふにゃー', 'ふらふら', 'ふわり', 'ふかふか']
            },

            // --- 5個目 ---
            {
                vimeoId: 'https://vimeo.com/1148247403/928b575b7a?fl=ml&fe=ec', // ※これはサンプルのVimeo動画IDです。自分のIDに書き換えてください
                answer: 'がさがさ',
                options: ['かさかさ', 'がさがさ']
            },

            // --- 6個目 ---
            {
                vimeoId: 'https://vimeo.com/1148247457/e6fe5eb312?fl=ml&fe=ec', // ※サンプル用に同じIDを入れています
                answer: 'かさかさ',
                options: ['かさかさ', 'がさがさ']
            },

            // --- 7個目 ---
            {
                vimeoId: 'https://vimeo.com/1148247485/b21a287d0d?fl=ml&fe=ec', // ※これはサンプルのVimeo動画IDです。自分のIDに書き換えてください
                answer: 'がらがら',
                options: ['がらがら', 'からから']
            },

            // --- 8個目 ---
            {
                vimeoId: 'https://vimeo.com/1148247518/468e4fb3b7?fl=ml&fe=ec', // ※サンプル用に同じIDを入れています
                answer: 'からから',
                options: ['がらがら', 'からから']
            },

            // --- 9個目 ---
            {
                vimeoId: 'https://vimeo.com/1148247536/25a4654ab7?fl=ml&fe=ec', // ※これはサンプルのVimeo動画IDです。自分のIDに書き換えてください
                answer: 'ごろごろ',
                options: ['ごろごろ', 'ころころ']
            },

            // --- 10個目 ---
            {
                vimeoId: 'https://vimeo.com/1148247547/172219ee0f?fl=ml&fe=ec', // ※サンプル用に同じIDを入れています
                answer: 'ころころ',
                options: ['ごろごろ', 'ころころ']
            },

            // --- 11個目 ---
            {
                vimeoId: 'https://vimeo.com/1148247561/779cf2c012?fl=ml&fe=ec', // ※これはサンプルのVimeo動画IDです。自分のIDに書き換えてください
                answer: 'ドンドン',
                options: ['ドンドン', 'トントン']
            },

            // --- 12個目 ---
            {
                vimeoId: 'https://vimeo.com/1148247577/98cb295f74?fl=ml&fe=ec', // ※サンプル用に同じIDを入れています
                answer: 'トントン',
                options: ['ドンドン', 'トントン']
            },

            // --- 13個目 ---
            {
                vimeoId: 'https://vimeo.com/1148247592/c674a5717c?fl=ml&fe=ec', // ※これはサンプルのVimeo動画IDです。自分のIDに書き換えてください
                answer: 'バンッ',
                options: ['バンッ', 'パンッ']
            },

            // --- 14個目 ---
            {
                vimeoId: 'https://vimeo.com/1148247607/df73d79fce?fl=ml&fe=ec', // ※サンプル用に同じIDを入れています
                answer: 'パンッ',
                options: ['バンッ', 'パンッ']
            },
            // 必要なだけ {} を追加してください
        ];

        // ==========================================
        // 【ロジックエリア】ここから下は変更不要です
        // ==========================================

        const videoContainer = document.getElementById('video-container');
        const choicesContainer = document.getElementById('choices-container');
        const resultArea = document.getElementById('result-area');
        const nextBtn = document.getElementById('next-btn');

        // 1. クイズをランダムに1つ選ぶ
        // ※データが空の場合のエラー回避を追加
        if (quizData.length === 0) {
            resultArea.innerHTML = "クイズデータがありません。";
            throw new Error("Quiz data is empty.");
        }
        const currentQuiz = quizData[Math.floor(Math.random() * quizData.length)];

        // 2. Vimeoプレーヤーをセットアップ
        const options = {
            url: currentQuiz.vimeoId,
            responsive: true,
            loop: true,
            autoplay: true,
            muted: true,
            controls: false
        };

        const player = new Vimeo.Player('video-container', options);
        player.setVolume(0);

        // 3. 選択肢ボタンをシャッフルして表示する関数
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const shuffledOptions = shuffle([...currentQuiz.options]);

        shuffledOptions.forEach(text => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = text;
            
            // ボタンを押した時の処理
            btn.onclick = () => {
                checkAnswer(text);
            };
            
            choicesContainer.appendChild(btn);
        });

        // 4. 正誤判定の処理
        function checkAnswer(selectedText) {
            // すべてのボタンを押せなくする
            const allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach(btn => btn.disabled = true);

            if (selectedText === currentQuiz.answer) {
                resultArea.innerHTML = '<span class="correct">せいかい！⭕️</span>';
            } else {
                resultArea.innerHTML = '<span class="incorrect">ざんねん... せいかいは「' + currentQuiz.answer + '」でした</span>';
            }
            
            // 次へボタンを表示
            nextBtn.style.display = 'inline-block';
        }

    </script>
</body>
</html>
